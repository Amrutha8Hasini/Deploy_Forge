server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container (name "backend" in docker-compose.yml)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;   # cloning a repository can take a while
    }

    # Single-page app: unknown paths like /projects load index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
