# CONTINUOUS INTEGRATION
# Runs on every push and pull request:
#   1. backend tests (pytest)   2. sample app tests   3. frontend build
#   4. Docker images build, the platform starts with Docker Compose and
#      really deploys the sample app (end-to-end test)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up uv (and Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml
        run: if [ -f uv.lock ]; then uv sync --locked; else uv sync; fi

      - name: Run tests
        run: uv run pytest -v

  sample-app-tests:
    name: Sample app tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (and Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run tests
        # The sample app keeps requirements.txt (that is what DeployForge detects),
        # so uv creates a temporary environment from it plus pytest.
        run: uv run --no-project --with-requirements requirements.txt --with pytest pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Save the built files
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker build + end-to-end deployment
    runs-on: ubuntu-latest
    needs: [backend-tests, sample-app-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker images
        run: docker compose build

      - name: Show the images
        run: docker images | grep deployforge

      - name: Start the platform with Docker Compose
        run: docker compose up -d --wait

      - name: Check that the frontend serves the dashboard
        run: curl -fs http://localhost:3000 | grep -q "DeployForge"

      - name: Deploy the sample app through DeployForge
        # Uses this workflow's own token so the clone also works for a private repository
        run: |
          ./scripts/e2e_test.sh \
            "${{ github.server_url }}/${{ github.repository }}" \
            "${{ github.head_ref || github.ref_name }}" \
            "${{ secrets.GITHUB_TOKEN }}"

      - name: Show container logs (if something failed)
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the platform
        if: always()
        run: docker compose down -v
