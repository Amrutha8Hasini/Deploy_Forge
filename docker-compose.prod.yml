# Used by the deploy workflow: run the images published to GitHub Container
# Registry instead of building them locally.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/deployforge-backend:${IMAGE_TAG:-latest}
    pull_policy: always
  frontend:
    image: ghcr.io/${GHCR_OWNER}/deployforge-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
