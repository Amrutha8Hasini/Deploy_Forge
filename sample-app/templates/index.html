<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ name }} v{{ version }}</title>
  <style>
    :root { --accent: {{ color }}; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--accent) 35%, #0b0d17), #0b0d17 60%);
      color: #e5e7eb; padding: 24px;
    }
    .card {
      width: 100%; max-width: 560px; background: rgba(17, 20, 36, 0.85);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      padding: 6px 12px; border-radius: 999px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    h1 { font-size: 30px; margin: 18px 0 6px; }
    .version { font-size: 56px; font-weight: 800; color: var(--accent); margin: 10px 0 24px; letter-spacing: -1px; }
    dl { display: grid; grid-template-columns: 130px 1fr; gap: 10px 16px; margin: 0; font-size: 14px; }
    dt { color: #9ca3af; } dd { margin: 0; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
    .links { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
    a { color: #fff; text-decoration: none; font-size: 14px; padding: 9px 14px; border-radius: 10px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }
    a:hover { border-color: var(--accent); }
    footer { margin-top: 28px; font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge"><span class="dot"></span> Deployed with DeployForge</span>
    <h1>{{ name }}</h1>
    <div class="version">v{{ version }}</div>
    <dl>
      <dt>Container</dt><dd>{{ container }}</dd>
      <dt>Started at</dt><dd>{{ started_at }}</dd>
      <dt>Server time</dt><dd>{{ server_time }}</dd>
    </dl>
    <div class="links">
      <a href="/health">/health</a>
      <a href="/api/info">/api/info</a>
      <a href="/api/greet?name=NIE">/api/greet?name=NIE</a>
    </div>
    <footer>CDD Project Expo &middot; NIE North Campus, Mysore</footer>
  </main>
</body>
</html>
